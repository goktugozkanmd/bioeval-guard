[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioeval-guard"
version = "0.8.0"
description = "Deterministic hygiene, biological sequence integrity, and question-blind shortcut auditing for frontier AI biosecurity and biology benchmarks."
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "Göktuğ Özkan, MD", email = "drozkan2@gmail.com"}
]
requires-python = ">=3.10"
keywords = ["biosecurity", "ai-safety", "benchmarks", "evaluation", "inspect-ai", "lab-bench", "wmdp", "bixbench"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Security",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyarrow>=12.0",
]

[project.optional-dependencies]
inspect = ["inspect-ai>=0.3.0"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
bioeval-guard = "bioeval_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
